[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drm"
version = "0.0.1"
description = "Distributed Resource Manager - local control daemon, CLI and desktop shell for GptCompress experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
]
ui = [
    "PySide6>=6.6",
]

[project.scripts]
drm = "drm.cli.main:main"
drmgr = "drm.cli.main:main"
drm-ui = "drm.ui.main:main"

[tool.setuptools.packages.find]
where = ["src"]
